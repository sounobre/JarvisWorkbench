spring:
  datasource:
    url: ${JARVIS_DB_URL:jdbc:postgresql://localhost:5432/jarvis_workbench}
    username: ${JARVIS_DB_USERNAME:postgres}
    password: ${JARVIS_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration